<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner menu manager</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Caveat+Brush&family=Rock+Salt&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#0B0B0B}
a{color:#FBF6EC}a:hover{color:#E0702E}
</style>
</helmet>
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; font-family: 'Space Grotesk', sans-serif; color: #FBF6EC; background: #0B0B0B; display: flex; flex-direction: column">
  <header style="background: #C2582A; color: #0B0B0B; padding: 14px 20px; display: flex; align-items: center; gap: 12px">
    <a href="Dashboard.dc.html" aria-label="Back to dashboard" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 2px solid #0B0B0B; border-radius: 50%; color: #0B0B0B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; flex-direction: column"><span style="font-family: 'Rock Salt', cursive; font-size: 12px">Owner</span><span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; line-height: 1">Menu manager</span></div>
  </header>

  <div style="padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 20px">
    <section style="background: #141211; border: 3px solid #E0702E; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-family: 'Rock Salt', cursive; font-size: 12px; color: #E0702E">Editing · Burgs</span>
      <div style="display: flex; gap: 12px; align-items: flex-start">
        <button type="button" style="width: 96px; height: 96px; flex-shrink: 0; border: 3px dashed #D8923E; border-radius: 14px; background: #0B0B0B; color: #D8923E; font-family: 'Rock Salt', cursive; font-size: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; padding: 6px; box-sizing: border-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"></path><path d="M6 10l6-6 6 6"></path><path d="M4 20h16"></path></svg>
          <span>Change photo</span>
        </button>
        <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1; min-width: 0">
          <label for="name" style="font-size: 12px; font-weight: 700; color: #C9C1B3">Name</label>
          <input id="name" type="text" value="Hot Honey" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 2px solid #3D1013; border-radius: 10px; background: #0B0B0B; color: #FBF6EC; font-family: 'Caveat Brush', cursive; font-size: 24px">
          <label for="price" style="font-size: 12px; font-weight: 700; color: #C9C1B3">Price (Rs)</label>
          <input id="price" type="number" value="240" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 2px solid #3D1013; border-radius: 10px; background: #0B0B0B; color: #E0702E; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px">
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="height: 50px; border: none; border-radius: 999px; background: #E0702E; color: #0B0B0B; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; cursor: pointer">Save</button>
        <button type="button" style="height: 50px; border: 3px solid #FBF6EC; border-radius: 999px; background: transparent; color: #FBF6EC; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; cursor: pointer">Cancel</button>
      </div>
    </section>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: 'Rock Salt', cursive; font-size: 16px; color: #B3262E">{{g.name}}</span>
        <sc-for list="{{g.items}}" as="item" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 10px; background: #141211; border: 2px solid #3D1013; border-radius: 14px; padding: 10px 12px; opacity: {{item.opacity}}">
            <div style="width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0; background: #0B0B0B; border: 2px dashed #3D1013; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 48 56" width="18" height="21" aria-hidden="true" fill="none" stroke="#3D1013" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M10 24c0-8 6-12 14-12s14 4 14 12v10c0 6-4 10-8 12l-6 4-6-4c-4-2-8-6-8-12z"></path></svg></div>
            <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0; gap: 0">
              <span style="font-family: 'Caveat Brush', cursive; font-size: 22px; line-height: 1">{{item.name}}</span>
              <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 15px; color: #E0702E">Rs {{item.price}}</span>
            </div>
            <button type="button" aria-label="Edit {{item.name}}" style="width: 44px; height: 44px; border: 2px solid #FBF6EC; border-radius: 50%; background: transparent; color: #FBF6EC; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
            <button type="button" onClick="{{item.toggle}}" aria-pressed="{{item.soldOut}}" aria-label="Sold out toggle for {{item.name}}" style="width: 58px; height: 32px; flex-shrink: 0; border-radius: 999px; border: 2px solid #0B0B0B; box-sizing: border-box; background: {{item.track}}; position: relative; cursor: pointer; padding: 0"><span style="position: absolute; top: 2px; left: {{item.knob}}; width: 24px; height: 24px; border-radius: 50%; background: #0B0B0B"></span></button>
          </div>
        </sc-for>
      </section>
    </sc-for>
    <div style="display: flex; gap: 14px; font-size: 12px; color: #C9C1B3; justify-content: center"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #D8923E"></span>on menu</span><span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #B3262E"></span>sold out today</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { so: { 'Nashville': true } }; }
  renderVals() {
    const so = this.state.so;
    const data = [['Burgs', [['Killa Korean', 260], ['Hot Honey', 240], ['Master Makhani', 240], ['BBQ', 240], ['Nashville', 260], ['Classic', 220]]], ['Smashers', [['Singular', 260], ['Double Down', 280]]], ['Packers', [['Fryday Box', 260]]]];
    return { groups: data.map(([name, items]) => ({ name, items: items.map(([n, price]) => { const s = !!so[n]; return { name: n, price, soldOut: s, opacity: s ? 0.7 : 1, track: s ? '#B3262E' : '#D8923E', knob: s ? '28px' : '2px', toggle: () => this.setState({ so: { ...so, [n]: !s } }) }; }) })) };
  }
}
</script>
</body>
</html>
