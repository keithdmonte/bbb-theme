<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Caveat+Brush&family=Rock+Salt&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#0B0B0B}
a{color:#FBF6EC}a:hover{color:#E0702E}
</style>
</helmet>
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; font-family: 'Space Grotesk', sans-serif; color: #FBF6EC; background: #0B0B0B; position: relative; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box">
  <div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
      <div style="font-family: 'Rock Salt', cursive; font-size: 30px; line-height: 90px; color: #3D1013; white-space: nowrap; letter-spacing: 0.12em; margin-left: {{r.ml}}">{{r.t}}</div>
    </sc-for>
  </div>
  <div style="position: relative; z-index: 1; display: flex; flex-direction: column; flex-grow: 1; padding: 20px; gap: 28px">
    <a href="Cart.dc.html" aria-label="Back to cart" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 2px solid #FBF6EC; border-radius: 50%"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 20px">
      <svg viewBox="0 0 48 56" width="56" height="65" aria-hidden="true" fill="none" stroke="#C2582A" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M16 14c0-5 3-8 6-8 2 0 3 1 4 3 1-3 3-5 6-5 3 0 5 3 5 6"></path><path d="M10 24c0-8 6-12 14-12s14 4 14 12v10c0 6-4 10-8 12l-6 4-6-4c-4-2-8-6-8-12z"></path><circle cx="18" cy="26" r="2" fill="#C2582A" stroke="none"></circle><circle cx="30" cy="26" r="2" fill="#C2582A" stroke="none"></circle><path d="M24 30l5 5-5 5-5-5z"></path></svg>
      <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 52px; line-height: 0.9; letter-spacing: -0.02em">Who's<br>eating?</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #C9C1B3">Sign in so the owner can confirm your slot. Updates show on your order page, not SMS or WhatsApp.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-family: 'Rock Salt', cursive; font-size: 12px; color: #E0702E">Step 1 of 2</span>
      <button type="button" style="height: 60px; border-radius: 999px; border: none; background: #FBF6EC; color: #0B0B0B; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; box-shadow: 5px 5px 0 #E0702E">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.7v3h3.9c2.3-2.1 3.5-5.2 3.5-8.9z"></path><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3a7.2 7.2 0 0 1-10.8-3.8H1.3v3.1A12 12 0 0 0 12 24z"></path><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8l4-3.1z"></path><path fill="#EA4335" d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.5-3.5A12 12 0 0 0 1.3 6.6l4 3.1A7.2 7.2 0 0 1 12 4.8z"></path></svg>
        Continue with Google
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; background: #141211; border: 3px solid #3D1013; border-radius: 20px; padding: 18px">
      <span style="font-family: 'Rock Salt', cursive; font-size: 12px; color: #E0702E">Step 2 of 2 · required</span>
      <label for="phone" style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px">Phone number</label>
      <div style="display: flex; gap: 8px">
        <span style="height: 56px; padding: 0 14px; display: flex; align-items: center; border: 2px solid #3D1013; border-radius: 12px; font-weight: 700; color: #C9C1B3">+91</span>
        <input id="phone" type="tel" inputmode="numeric" placeholder="98765 43210" style="flex-grow: 1; min-width: 0; height: 56px; box-sizing: border-box; padding: 0 16px; border: 2px solid #D8923E; border-radius: 12px; background: #0B0B0B; color: #FBF6EC; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">
      </div>
      <span style="font-size: 13px; color: #C9C1B3">The owner may call this number about your pickup.</span>
      <a href="Status.dc.html" style="margin-top: 4px; height: 56px; display: flex; align-items: center; justify-content: center; text-decoration: none; border-radius: 999px; background: #E0702E; color: #0B0B0B; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px">Send order request</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { rows: Array.from({ length: 12 }, (_, i) => ({ t: i % 2 ? 'SUNDAY  MENU  SUNDAY  MENU  SUNDAY' : 'MENU  SUNDAY  MENU  SUNDAY  MENU', ml: (i % 3) * -50 + 'px' })) };
  }
}
</script>
</body>
</html>
