<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My orders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Caveat+Brush&family=Rock+Salt&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#0B0B0B}
a{color:#FBF6EC}a:hover{color:#E0702E}
</style>
</helmet>
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; font-family: 'Space Grotesk', sans-serif; color: #FBF6EC; background: #0B0B0B; display: flex; flex-direction: column">
  <header style="border-bottom: 3px solid #3D1013; padding: 14px 20px; display: flex; align-items: center; gap: 12px">
    <a href="HomeM.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 2px solid #FBF6EC; border-radius: 50%"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-family: 'Rock Salt', cursive; font-size: 18px; color: #B3262E">My orders</span>
  </header>
  <div style="padding: 20px; display: flex; flex-direction: column; gap: 26px">
    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; line-height: 1">This Sunday</h2>
      <sc-for list="{{current}}" as="o" hint-placeholder-count="1">
        <a href="Status.dc.html" style="text-decoration: none; background: {{o.bg}}; color: {{o.fg}}; border: 3px solid {{o.border}}; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px; transform: rotate(-1deg)">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span style="font-family: 'Rock Salt', cursive; font-size: 12px">{{o.code}} · Sun {{o.date}}</span>
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; background: {{o.chipBg}}; color: {{o.chipFg}}; padding: 6px 10px; border-radius: 999px">{{o.status}}</span>
          </div>
          <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; line-height: 0.95">{{o.headline}}</span>
          <span style="font-size: 14px; opacity: 0.85">{{o.items}} · pickup {{o.slot}}</span>
          <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px">{{o.cta}}<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span>
        </a>
      </sc-for>
    </section>
    <section style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h2 style="margin: 0; font-family: 'Rock Salt', cursive; font-size: 20px; color: #B3262E; line-height: 1.4">Past Sundays</h2>
        <svg width="150" height="12" viewBox="0 0 150 12" aria-hidden="true" fill="none" stroke="#B3262E" stroke-width="3" stroke-linecap="round"><path d="M3 8c30-6 50 4 80-2s30-4 64 3"></path></svg>
      </div>
      <sc-for list="{{past}}" as="p" hint-placeholder-count="3">
        <a href="Status.dc.html" style="text-decoration: none; display: flex; align-items: center; gap: 12px; background: #141211; border: 3px solid #3D1013; border-radius: 16px; padding: 14px">
          <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0; gap: 2px">
            <span style="font-weight: 700; font-size: 15px">Sun {{p.date}} · {{p.code}}</span>
            <span style="font-family: 'Caveat Brush', cursive; font-size: 22px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.items}}</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: #E0702E">Rs {{p.total}}</span>
            <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: {{p.color}}">{{p.status}}</span>
          </div>
        </a>
      </sc-for>
    </section>
    <a href="Menu.dc.html" style="text-decoration: none; background: #E0702E; color: #0B0B0B; padding: 18px; text-align: center; border-radius: 999px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; box-shadow: 5px 5px 0 #FBF6EC">Order for this Sunday</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const d = new Date(); d.setDate(d.getDate() + ((7 - d.getDay()) % 7));
    const f = x => x.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    const back = n => { const x = new Date(d); x.setDate(d.getDate() - 7 * n); return f(x); };
    return {
      current: [{ code: 'BBB-0427', date: f(d), status: 'Pay now', headline: 'Accepted. Pay Rs 820.', items: '1 Killa Korean, 2 Double Down', slot: '2:00 pm', cta: 'Open and pay', bg: '#E0702E', fg: '#0B0B0B', border: '#E0702E', chipBg: '#0B0B0B', chipFg: '#FBF6EC' }],
      past: [
        { code: 'BBB-0391', date: back(1), items: '2 Hot Honey', total: 480, status: 'Picked up', color: '#D8923E' },
        { code: 'BBB-0352', date: back(2), items: '1 Nashville, 1 Fryday Box', total: 520, status: 'Picked up', color: '#D8923E' },
        { code: 'BBB-0310', date: back(4), items: '1 Classic', total: 220, status: 'Rejected', color: '#B3262E' }
      ]
    };
  }
}
</script>
</body>
</html>
