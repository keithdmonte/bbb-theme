<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burnt Butter Buns home, mobile, sold out</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0B0B0B}
</style>
</helmet>
<div style="width: 100%; max-width: 480px; margin: 0 auto">
  <dc-import name="HomeM" sold-out="{{ soldOut }}" hint-size="390px,1760px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"soldOut":{"editor":"boolean","default":true,"section":"State"},"$preview":{"width":390,"height":1760}}'>
class Component extends DCLogic {
  renderVals() { return { soldOut: this.props.soldOut ?? true }; }
}
</script>
</body>
</html>
